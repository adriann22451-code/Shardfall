<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shardfall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }

  #hud { position: fixed; top: 12px; left: 12px; color: #fff; font-size: 13px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hpbar { width: 220px; height: 12px; background: #400; border: 1px solid #fff; margin: 6px 0; }
  #hp { height: 100%; width: 100%; background: #e33; }
  #help { opacity: .75; max-width: 260px; line-height: 1.4; }

  #controls { position: fixed; inset: 0; pointer-events: none; }

  #stick { position: absolute; left: 24px; bottom: 28px; width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.3); pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
    background: rgba(255,255,255,.35); pointer-events: none; }

  .btn { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(40,50,80,.6);
    color: #fff; font: 700 12px system-ui, sans-serif; pointer-events: auto; touch-action: none; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.15; }
  .btn small { font-weight: 400; opacity: .7; font-size: 10px; }
  .btn:active { background: rgba(90,110,170,.75); }
  .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: rgba(0,0,0,.65);
    transform-origin: bottom; transform: scaleY(0); pointer-events: none; }
  .cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 20px; pointer-events: none; text-shadow: 0 1px 3px #000; }

  #btnAttack { right: 24px; bottom: 30px; width: 84px; height: 84px; font-size: 14px; background: rgba(150,50,50,.65); }
  #btnS1 { right: 122px; bottom: 34px; width: 60px; height: 60px; }
  #btnS2 { right: 112px; bottom: 118px; width: 60px; height: 60px; }
  #btnDodge { right: 28px; bottom: 126px; width: 60px; height: 60px; }
  #btnTalk { right: 24px; bottom: 210px; width: 72px; height: 72px; background: rgba(60,120,80,.75); display: none; }

  #dialog { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    box-sizing: border-box; padding: 12px 16px 10px; border-radius: 10px; border: 2px solid rgba(255,233,168,.7);
    background: rgba(15,18,30,.88); color: #fff; display: none; z-index: 5; touch-action: none; }
  #dialogName { font-weight: 700; color: #ffe9a8; margin-bottom: 4px; }
  #dialogText { font-size: 15px; line-height: 1.45; }
  #dialogHint { margin-top: 6px; font-size: 11px; opacity: .6; text-align: right; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="hud">
    <div style="font-size:20px;font-weight:700;letter-spacing:2px;">SHARDFALL</div>
    <div id="hpbar"><div id="hp"></div></div>
    <div id="info"></div>
    <div id="help">WASD / joystick: jalan &middot; Spasi / klik: serang &middot; 1, 2: skill &middot; Shift: hindar &middot; F: bicara<br>Klik kanan + geser, geser layar, atau Q/E: putar kamera &middot; Roda mouse / cubit: zoom</div>
  </div>

  <div id="controls">
    <div id="stick"><div id="knob"></div></div>

    <div class="btn" id="btnS2">Tusuk<small>2</small><div class="cd"></div><div class="cdt"></div></div>
    <div class="btn" id="btnS1">Lompat<small>1</small><div class="cd"></div><div class="cdt"></div></div>
    <div class="btn" id="btnDodge">Hindar<small>Shift</small><div class="cd"></div><div class="cdt"></div></div>
    <div class="btn" id="btnTalk">Bicara<small>F</small></div>
    <div class="btn" id="btnAttack">Serang<small>Spasi</small></div>
  </div>

  <div id="dialog"><div id="dialogName"></div><div id="dialogText"></div><div id="dialogHint">ketuk / F: lanjut</div></div>

  <script type="module" src="main.js"></script>
</body>
</html>
